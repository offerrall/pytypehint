[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytypehint"
dynamic = ["version"]
description = "Compiles Python type hints into strict, inspectable, portable contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Beltrán Offerrall" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://offerrall.github.io/pytypehint/"
Repository = "https://github.com/offerrall/pytypehint"
Changelog = "https://github.com/offerrall/pytypehint/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["mypy", "pytest", "hypothesis"]

[tool.hatch.version]
path = "src/pytypehint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytypehint"]

[tool.hatch.build.targets.sdist]
exclude = ["/.hypothesis", "/.ruff_cache", "/.pytest_cache", "/.mypy_cache"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]